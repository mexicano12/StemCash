<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StemCash - Error de Acceso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .error-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .error-title {
            color: #c62828; /* Rojo suave */
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .error-message {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-regresar {
            background-color: var(--primary, #2e7d32); /* Tu verde principal */
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-block;
        }
        .btn-regresar:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🔒🤷‍♂️</div>
        <h1 class="error-title">¡Vaya, algo falló!</h1>
        <p class="error-message">
            El correo o la contraseña que ingresaste no coinciden con nuestros registros. 
            Revisa que no tengas activadas las mayúsculas e inténtalo de nuevo.
        </p>
        <a href="{{ url_for('login') }}" class="btn-regresar">Regresar al Inicio</a>
    </div>
</body>
</html>
